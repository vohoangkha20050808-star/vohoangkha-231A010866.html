  <div class="container">
    <h1>Đăng Ký Tài Khoản</h1>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Họ và tên:</label>
        <input type="text" id="name" required placeholder="Nhập họ tên...">
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required placeholder="Nhập email hợp lệ...">
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu:</label>
        <input type="password" id="password" required placeholder="Ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số...">
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="terms" required>
        <label for="terms" style="margin-bottom:0;">Đồng ý với các điều khoản dịch vụ</label>
      </div>
      <button type="submit" class="btn-submit">Đăng Ký</button>
      <div id="formMsg" class="msg" style="display:none;"></div>
    </form>
  </div>

  <script src="js/script.js"></script>
  <script>document.addEventListener("DOMContentLoaded", initRegisterForm);</script>
